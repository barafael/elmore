[package]
name = "elmore"
description = "A deliberately minimal Iced-like framework for simple interactive web pages using the Elm architecture."
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
gloo-timers = { version = "0.4", default-features = false, features = ["futures"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "Node",
    "NodeList",
    "Text",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "Event",
    "EventInit",
    "EventTarget",
    "KeyboardEvent",
    "KeyboardEventInit",
    "Response",
] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

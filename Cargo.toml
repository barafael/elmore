[workspace]
resolver = "2"
members = [
    "crates/elmore",
    "examples/counter",
    "examples/todo",
    "examples/stopwatch",
    "examples/weather",
    "examples/survey",
    "examples/chat",
    "examples/login",
    "examples/playlist",
    "examples/tictactoe",
    "examples/mixer",
    "examples/timer",
    "examples/notes",
    "halreslib-elmore",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"

# The generated data.rs in halreslib-elmore pastes ~2,000 fat struct literals
# into one `vec![]`; even `opt-level = "s"` inlining across them OOMs rustc
# (see ../halreslib-iced, which hit the same wall). The dataset is plain data
# — it needs no codegen.
[profile.release.package.halreslib-elmore]
opt-level = 0

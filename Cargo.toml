[workspace]
resolver = "2"
members = [
    "crates/elmore",
    "examples/counter",
    "examples/todo",
    "examples/stopwatch",
    "examples/weather",
    "examples/survey",
    "examples/chat",
    "examples/login",
    "examples/playlist",
    "examples/tictactoe",
    "examples/mixer",
    "examples/timer",
    "examples/notes",
    "examples/gallery",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.release]
opt-level = "s"

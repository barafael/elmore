[package]
name = "weather"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false
autobins = false

# wasm-pack builds a cdylib; point the lib target at the same source so the
# binary's `main` (annotated `#[wasm_bindgen(start)]`) becomes the wasm entry point.
[lib]
crate-type = ["cdylib", "rlib"]
path = "src/main.rs"


[dependencies]
elmore = { path = "../../crates/elmore" }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

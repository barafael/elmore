<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>elmore — examples</title>
    <style>
      * { box-sizing: border-box; }
      body { font-family: system-ui, sans-serif; margin: 0; }
      .gallery { display: flex; height: 100vh; }
      .sidebar { width: 16rem; border-right: 1px solid #ddd; padding: 1rem; overflow-y: auto; }
      .sidebar h1 { font-size: 1.1rem; font-weight: 600; margin: 0.25rem 0 1rem; }
      .sidebar .blurb { color: #666; font-size: 0.8rem; margin: 0.25rem 0 1.5rem; }
      .sidebar button { display: block; width: 100%; text-align: left; font-size: 0.95rem;
        padding: 0.45rem 0.6rem; margin: 0.15rem 0; border: none; border-radius: 6px;
        background: none; cursor: pointer; }
      .sidebar button:hover { background: #f0f0f0; }
      .sidebar button.active { background: #2563eb; color: white; }
      .stage { flex: 1; }
      .stage iframe { width: 100%; height: 100%; border: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import init from "./pkg/gallery.js";
      await init();
    </script>
  </body>
</html>
